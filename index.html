<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NFC Tool</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1f4e79">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.min.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header>
    <h1>NFC Tool</h1>
    <p>Lettura, scrittura (anche da QR Code) e formattazione NDEF di tag NFC.</p>
  </header>

  <nav>
    <button id="btnRead">Leggi</button>
    <button id="btnWrite">Scrivi</button>
    <button id="btnQr">Scrivi da QR</button>
    <button id="btnFormat">Formatta</button>
    <button id="btnCancel" hidden>Annulla</button>
    <button id="btnInstall" hidden>Installa app</button>
  </nav>

  <p id="status">Pronto.</p>
  <video id="preview" playsinline muted hidden></video>
  <pre><code id="output"></code></pre>

  <script>
    const statusEl = document.getElementById("status");
    const outputEl = document.getElementById("output");
    let controller = null;

    function setStatus(msg) { statusEl.textContent = msg; }
    function setOutput(msg) { outputEl.textContent = msg; }

    // Annulla l'operazione in corso (se c'è) e ne prepara una nuova
    function newOperation() {
      if (controller) controller.abort();
      controller = new AbortController();
      return controller.signal;
    }

    function checkSupport() {
      if (!("NDEFReader" in window)) {
        setStatus("Web NFC non supportato. Serve Chrome su Android, in HTTPS (o localhost).");
        return false;
      }
      return true;
    }

    function toHex(dataView) {
      const bytes = [];
      for (let i = 0; i < dataView.byteLength; i++) {
        bytes.push(dataView.getUint8(i).toString(16).padStart(2, "0"));
      }
      return bytes.join(":");
    }

    function decodeData(record) {
      if (!record.data) return "(nessun dato)";
      switch (record.recordType) {
        case "text":
          return new TextDecoder(record.encoding || "utf-8").decode(record.data);
        case "url":
        case "absolute-url":
          return new TextDecoder().decode(record.data);
        case "mime":
          if (record.mediaType && (record.mediaType.startsWith("text/") || record.mediaType === "application/json")) {
            return new TextDecoder().decode(record.data);
          }
          return "hex: " + toHex(record.data);
        default:
          return "hex: " + toHex(record.data);
      }
    }

    function describeRecord(record, index, indent = "") {
      let out = `${indent}Record #${index}\n`;
      out += `${indent}  recordType: ${record.recordType}\n`;
      out += `${indent}  mediaType:  ${record.mediaType ?? "-"}\n`;
      out += `${indent}  id:         ${record.id ?? "-"}\n`;
      out += `${indent}  encoding:   ${record.encoding ?? "-"}\n`;
      out += `${indent}  lang:       ${record.lang ?? "-"}\n`;
      out += `${indent}  data:       ${decodeData(record)}\n`;
      // Record annidati (es. smart-poster o record esterni)
      try {
        const nested = record.toRecords ? record.toRecords() : null;
        if (nested && nested.length) {
          out += `${indent}  record annidati:\n`;
          nested.forEach((r, i) => { out += describeRecord(r, i, indent + "    "); });
        }
      } catch (e) { /* il record non contiene un messaggio NDEF annidato */ }
      return out;
    }

    // LEGGI
    document.getElementById("btnRead").addEventListener("click", async () => {
      if (!checkSupport()) return;
      const signal = newOperation();
      setOutput("");
      try {
        const ndef = new NDEFReader();
        await ndef.scan({ signal });
        setStatus("In attesa del tag da leggere...");

        ndef.onreadingerror = () => {
          setStatus("Tag rilevato ma non leggibile (forse non è formattato NDEF).");
        };

        ndef.onreading = (event) => {
          const { serialNumber, message } = event;
          let out = `Serial number: ${serialNumber || "-"}\n`;
          out += `Numero record: ${message.records.length}\n\n`;
          message.records.forEach((r, i) => { out += describeRecord(r, i) + "\n"; });
          setOutput(out);
          setStatus("Tag letto.");
          controller.abort(); // una lettura e basta
        };
      } catch (err) {
        if (err.name !== "AbortError") setStatus("Errore lettura: " + err.message);
      }
    });

    // SCRIVI
    document.getElementById("btnWrite").addEventListener("click", async () => {
      if (!checkSupport()) return;
      const text = prompt("Cosa vuoi scrivere sul tag?");
      if (text === null) return;
      const signal = newOperation();
      setOutput("");
      try {
        const ndef = new NDEFReader();
        setStatus("In attesa del tag su cui scrivere...");
        await ndef.write({ records: [{ recordType: "text", data: text }] }, { signal, overwrite: true });
        setStatus("Scritto: \"" + text + "\"");
      } catch (err) {
        if (err.name !== "AbortError") setStatus("Errore scrittura: " + err.message);
      }
    });

    // FORMATTA
    document.getElementById("btnFormat").addEventListener("click", async () => {
      if (!checkSupport()) return;
      const signal = newOperation();
      setOutput("");
      try {
        const ndef = new NDEFReader();
        setStatus("In attesa del tag da formattare...");
        // Scrivere un messaggio con un record "empty" formatta il tag in NDEF
        // (se non lo è già) e ne cancella il contenuto.
        await ndef.write({ records: [{ recordType: "empty" }] }, { signal, overwrite: true });
        setStatus("Tag formattato NDEF (messaggio vuoto).");
      } catch (err) {
        if (err.name !== "AbortError") setStatus("Errore formattazione: " + err.message);
      }
    });

    // SCRIVI DA QR CODE
    const videoEl = document.getElementById("preview");
    const btnCancel = document.getElementById("btnCancel");

    // Un QR contiene quasi sempre un URL: scritto come record "url" il tag apre
    // il browser al tocco, cosa che un record "text" non farebbe.
    function recordForValue(value) {
      try {
        const url = new URL(value);
        if (url.protocol === "http:" || url.protocol === "https:") {
          return { recordType: "url", data: value };
        }
      } catch (e) { /* non è un URL assoluto: lo scriviamo come testo */ }
      return { recordType: "text", data: value };
    }

    // Spegne lo stream passato. L'anteprima viene chiusa solo se è ancora
    // quella di questo stream: una scansione annullata può concludersi dopo
    // che ne è già partita un'altra, e non deve spegnerle la fotocamera.
    function stopCamera(stream) {
      if (stream) stream.getTracks().forEach((track) => track.stop());
      if (videoEl.srcObject && videoEl.srcObject !== stream) return;
      videoEl.srcObject = null;
      videoEl.hidden = true;
      btnCancel.hidden = true;
    }

    // Accende la fotocamera e risolve con il contenuto del primo QR inquadrato
    async function scanQrCode(signal) {
      const detector = new BarcodeDetector({ formats: ["qr_code"] });
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" } }
      });
      // L'utente può aver annullato mentre concedeva il permesso
      if (signal.aborted) {
        stopCamera(stream);
        throw new DOMException("Annullato", "AbortError");
      }

      videoEl.srcObject = stream;
      videoEl.hidden = false;
      btnCancel.hidden = false;
      // play() viene rifiutata con AbortError quando la sorgente del video
      // cambia: non è un errore di scansione e non deve interromperla. Il ciclo
      // qui sotto parte comunque e i primi detect() a vuoto vengono ritentati.
      videoEl.play().catch(() => {});
      setStatus("Inquadra il QR Code da scrivere sul tag...");

      try {
        return await new Promise((resolve, reject) => {
          let done = false;
          const finish = (settle, arg) => {
            if (done) return;
            done = true;
            signal.removeEventListener("abort", onAbort);
            settle(arg);
          };
          const onAbort = () => finish(reject, new DOMException("Annullato", "AbortError"));
          signal.addEventListener("abort", onAbort, { once: true });

          // ~10 analisi al secondo: abbastanza reattivo senza scaldare il telefono
          const tick = async () => {
            if (done) return;
            try {
              const [code] = await detector.detect(videoEl);
              if (code && code.rawValue) return finish(resolve, code.rawValue);
            } catch (e) { /* frame non analizzabile: si riprova al giro dopo */ }
            if (!done) setTimeout(tick, 100);
          };
          tick();
        });
      } finally {
        stopCamera(stream);
      }
    }

    document.getElementById("btnQr").addEventListener("click", async () => {
      if (!checkSupport()) return;
      if (!("BarcodeDetector" in window)) {
        setStatus("Scansione QR non supportata da questo browser. Serve Chrome su Android.");
        return;
      }
      const signal = newOperation();
      setOutput("");

      let value;
      try {
        value = await scanQrCode(signal);
      } catch (err) {
        if (err.name === "NotAllowedError") setStatus("Permesso fotocamera negato.");
        else if (err.name === "NotFoundError") setStatus("Nessuna fotocamera disponibile.");
        else if (err.name !== "AbortError") setStatus("Errore fotocamera: " + err.message);
        return;
      }

      setOutput(value);
      try {
        const record = recordForValue(value);
        const ndef = new NDEFReader();
        setStatus(`QR letto (record ${record.recordType}). In attesa del tag su cui scrivere...`);
        await ndef.write({ records: [record] }, { signal, overwrite: true });
        setStatus("Scritto dal QR: \"" + value + "\"");
      } catch (err) {
        if (err.name !== "AbortError") setStatus("Errore scrittura: " + err.message);
      }
    });

    btnCancel.addEventListener("click", () => {
      if (controller) controller.abort();
      setStatus("Operazione annullata.");
    });

    // PWA: registrazione service worker
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch((err) => {
          console.warn("Service worker non registrato:", err);
        });
      });
    }

    // PWA: bottone "Installa" mostrato solo quando il browser lo consente
    const btnInstall = document.getElementById("btnInstall");
    let deferredPrompt = null;
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      btnInstall.hidden = false;
    });
    btnInstall.addEventListener("click", async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      btnInstall.hidden = true;
    });
    window.addEventListener("appinstalled", () => { btnInstall.hidden = true; });
  </script>
</body>
</html>
